# Pages CMS (https://pagescms.org): bearbeitet die Dateien im Repo, es gibt keine Datenbank.
# Hinweis: Nur nach der Doku zusammengestellt, noch nicht im CMS getestet.
media:
  input: src/assets/recipes
  output: ../assets/recipes
  categories: [image]

content:
  - name: recipes
    label: Rezepte
    type: collection
    path: src/recipes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: geschmack
        label: Geschmack
        type: select
        required: true
        options:
          values:
            - name: suess
              label: süss
            - name: herzhaft
              label: herzhaft
      - name: eigenschaften
        label: Eigenschaften (schnell wird bei 15 Minuten oder weniger automatisch gesetzt)
        type: select
        options:
          multiple: true
          values:
            - name: proteinreich
              label: proteinreich
            - name: low-carb
              label: low-carb
            - name: glutenfrei
              label: glutenfrei
            - name: vegetarisch
              label: vegetarisch
      - name: kategorien
        label: Kategorien (optional)
        type: reference
        options:
          collection: categories
          multiple: true
          value: "{primary}"
          label: "{title}"
      - name: gesamtzeit
        label: Gesamtzeit in Minuten
        type: number
        required: true
      - name: aktivzeit
        label: Aktive Zeit in Minuten (optional)
        type: number
      - name: kompakt
        label: Rezeptkarte – ein Verb pro Schritt
        description: 'Ein Eintrag pro Schritt, gleiche Reihenfolge wie der Text (z. B. mischen, formen, backen). "*" am Ende (mischen*) = eigener Strang nur mit den neuen Zutaten. "|" fügt Zusatzzeilen hinzu und ersetzt die automatische Hitze/Dauer: formen|Klumpen à 80–120 g|andrücken. Nur "rösten|" = ohne Zusatz. Ohne "|" werden °C und Dauer aus dem Text übernommen.'
        type: string
        list: true
      - name: portionen
        label: Portionen
        type: number
        required: true
      - name: bild
        label: Hauptbild (optional)
        type: object
        fields:
          - name: datei
            label: Bild
            type: image
            options:
              media: recipes
          - name: alt
            label: Alt-Text (Pflicht, wenn ein Bild gewählt ist)
            type: string
      - name: quellen
        label: Quellen (optional)
        type: reference
        options:
          collection: quellen
          multiple: true
          value: "{primary}"
          label: "{title}"
      - name: body
        label: Rezept in Cooklang
        type: text

  - name: categories
    label: Kategorien (Serien)
    type: collection
    path: src/categories
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: kurztext
        label: Kurztext
        type: text
      - name: bild
        label: Titelbild (optional)
        type: object
        fields:
          - name: datei
            label: Bild
            type: image
            options:
              media: recipes
          - name: alt
            label: Alt-Text
            type: string

  - name: posts
    label: Wissenswertes (Blog)
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: teaser
        label: Teaser (ein bis zwei Sätze)
        type: text
        required: true
      - name: kategorie
        label: Kategorie (optional, z. B. Brainfood)
        type: string
      - name: datum
        label: Sortierdatum (wird nicht angezeigt)
        type: date
        required: true
      - name: quellen
        label: Quellen (Titel, in Reihenfolge der Nummerierung)
        type: reference
        options:
          collection: quellen
          multiple: true
          value: "{primary}"
          label: "{title}"
      - name: body
        label: Text
        type: rich-text

  - name: quellen
    label: Quellen
    type: collection
    path: src/quellen
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Titel der Quelle
        type: string
        required: true
      - name: autor
        label: Autor oder Organisation
        type: string
      - name: jahr
        label: Jahr
        type: number
      - name: link
        label: Link (https://…)
        type: string

  - name: seiten
    label: Seiten (About)
    type: collection
    path: src/seiten
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: body
        label: Text
        type: rich-text
